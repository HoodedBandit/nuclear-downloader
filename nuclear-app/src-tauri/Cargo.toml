[package]
name = "nuclear"
version = "0.6.0"
description = "Nuclear Downloader is an easy-to-use Windows desktop downloader for YouTube, X, and other yt-dlp-supported sites."
authors = ["HoodedBandit"]
edition = "2021"
rust-version = "1.94.1"
license-file = "../../LICENSE"
publish = false

[lib]
name = "nuclear_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "=2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "fs", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
dirs = "6"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
semver = "1"
futures-util = "0.3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
minisign-verify = "=0.2.5"
ts-rs = { version = "=12.0.1", features = ["uuid-impl"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
