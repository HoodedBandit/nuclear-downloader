version: 2
# Keep main as the repository's only branch; dependency updates are applied manually.
# Vulnerability alerts and existing dependency checks remain configured separately.
updates:
  - package-ecosystem: npm
    directory: /nuclear-app
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    open-pull-requests-limit: 0
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /nuclear-app/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Denver
    open-pull-requests-limit: 0
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Denver
    open-pull-requests-limit: 0
