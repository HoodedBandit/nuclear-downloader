name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact application version (this workflow is pinned to 0.6.0)
        required: true
        default: 0.6.0
        type: string
      runtime_version:
        description: Exact three-component managed-runtime version
        required: true
        default: 2026.07.04
        type: string
      published_at:
        description: Optional canonical UTC timestamp (yyyy-MM-ddTHH:mm:ssZ)
        required: false
        type: string
      confirmation:
        description: Type BUILD v0.6.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuclear-downloader-release-candidate
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build and verify private candidate
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release-candidate

    steps:
      - name: Validate manual release request
        shell: pwsh
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          INPUT_RUNTIME_VERSION: ${{ inputs.runtime_version }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ($env:INPUT_RELEASE_VERSION -cne '0.6.0') {
            throw 'This workflow is pinned to application version 0.6.0.'
          }
          if ($env:INPUT_RUNTIME_VERSION -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'runtime_version must contain exactly three numeric dotted components.'
          }
          if ($env:INPUT_CONFIRMATION -cne 'BUILD v0.6.0') {
            throw 'The candidate confirmation text is not exact.'
          }

      - name: Check out the exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node.js 22.23.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: nuclear-app/package-lock.json

      - name: Pin npm 10.9.9
        shell: pwsh
        run: npm install --global npm@10.9.9

      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
          components: clippy,rustfmt

      - name: Install frontend dependencies
        working-directory: nuclear-app
        shell: pwsh
        run: npm ci

      - name: Run frontend quality gate
        working-directory: nuclear-app
        shell: pwsh
        run: |
          npm run format:check
          npm run lint
          npm run check
          npm test
          npm run test:e2e:renderer
          npm run build
          npm run test:e2e:production-bundle
          npm run audit:production

      - name: Run Rust quality gate
        working-directory: nuclear-app
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Enforce dependency and license policy
        working-directory: nuclear-app
        shell: pwsh
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --manifest-path src-tauri/Cargo.toml check

      - name: Test release packaging contracts
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/test-packaging.ps1
          pwsh -NoProfile -File scripts/test-e2e-contracts.ps1

      - name: Download and verify locked x64 sidecars
        shell: pwsh
        run: pwsh -NoProfile -File scripts/fetch-sidecars.ps1

      - name: Confirm tracked source is still clean
        shell: pwsh
        run: |
          $changes = @(git status --porcelain)
          if ($changes.Count -ne 0) {
            $changes | Write-Error
            throw 'Quality gates or sidecar preparation changed tracked source.'
          }

      - name: Build, sign, inventory, and verify candidate
        shell: pwsh
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          INPUT_RUNTIME_VERSION: ${{ inputs.runtime_version }}
          INPUT_PUBLISHED_AT: ${{ inputs.published_at }}
          NUCLEAR_UPDATE_KEY_ID: ${{ vars.NUCLEAR_UPDATE_KEY_ID }}
          NUCLEAR_UPDATE_PUBLIC_KEY: ${{ vars.NUCLEAR_UPDATE_PUBLIC_KEY }}
          NUCLEAR_UPDATE_NEXT_KEY_ID: ${{ vars.NUCLEAR_UPDATE_NEXT_KEY_ID }}
          NUCLEAR_UPDATE_NEXT_PUBLIC_KEY: ${{ vars.NUCLEAR_UPDATE_NEXT_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $arguments = @{
            Version = $env:INPUT_RELEASE_VERSION
            RuntimeVersion = $env:INPUT_RUNTIME_VERSION
            OutputDirectory = 'nuclear-app\src-tauri\target\release-candidate-0.6.0'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_PUBLISHED_AT)) {
            $arguments.PublishedAt = $env:INPUT_PUBLISHED_AT
          }
          & scripts/build-release-candidate.ps1 @arguments

      - name: Install pinned external Tauri WebDriver
        shell: pwsh
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Test the exact installer and portable candidate bytes
        shell: pwsh
        env:
          NUCLEAR_PUBLIC_SMOKE_URL: ${{ vars.NUCLEAR_PUBLIC_SMOKE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUCLEAR_PUBLIC_SMOKE_URL)) {
            throw 'Configure NUCLEAR_PUBLIC_SMOKE_URL with the maintainer-controlled sub-15-second HTTPS media URL.'
          }
          & scripts/run-windows-candidate-acceptance.ps1 `
            -CandidateDirectory 'nuclear-app\src-tauri\target\release-candidate-0.6.0' `
            -ResultsDirectory 'nuclear-app\src-tauri\target\release-acceptance-0.6.0' `
            -ExpectedVersion '0.6.0' `
            -ExpectedCommitSha '${{ github.sha }}' `
            -ExpectedCandidateRunId '${{ github.run_id }}' `
            -PublicSmokeUrl $env:NUCLEAR_PUBLIC_SMOKE_URL

      - name: Upload private acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuclear-downloader-0.6.0-acceptance
          path: nuclear-app/src-tauri/target/release-acceptance-0.6.0/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: false

      - name: Upload private candidate bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuclear-downloader-0.6.0-candidate
          path: nuclear-app/src-tauri/target/release-candidate-0.6.0/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: false
