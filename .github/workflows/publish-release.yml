name: Publish Release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Release Candidate workflow run ID
        required: true
        type: string
      release_version:
        description: Exact application version (this workflow is pinned to 0.7.1)
        required: true
        default: 0.7.1
        type: string
      confirmation:
        description: Type PUBLISH v0.7.1, or PUBLISH v0.7.1 WITH MANUAL CHECKS PENDING for pending qualification
        required: true
        type: string
      manual_qualification:
        description: Complete requires verified manual evidence; pending records and publishes the outstanding checks
        required: true
        default: complete
        type: choice
        options:
          - complete
          - pending
      manual_acceptance_json:
        description: Exact verified manual JSON for complete qualification; leave empty for pending qualification
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: nuclear-downloader-production-release
  cancel-in-progress: false

jobs:
  verify-and-publish:
    name: Verify candidate bytes and publish without rebuilding
    runs-on: windows-latest
    timeout-minutes: 30
    environment: production-release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Validate protected publish approval and candidate run
        id: candidate
        shell: pwsh
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          INPUT_MANUAL_QUALIFICATION: ${{ inputs.manual_qualification }}
          INPUT_MANUAL_ACCEPTANCE_JSON: ${{ inputs.manual_acceptance_json }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:INPUT_RELEASE_VERSION -cne '0.7.1') {
            throw 'This workflow is pinned to application version 0.7.1.'
          }
          if ($env:INPUT_MANUAL_QUALIFICATION -cnotin @('complete', 'pending')) {
            throw 'Select complete or pending manual qualification explicitly.'
          }
          $expectedConfirmation = if ($env:INPUT_MANUAL_QUALIFICATION -ceq 'pending') {
            'PUBLISH v0.7.1 WITH MANUAL CHECKS PENDING'
          } else {
            'PUBLISH v0.7.1'
          }
          if ($env:INPUT_CONFIRMATION -cne $expectedConfirmation) {
            throw 'The publish confirmation text is not exact.'
          }
          if ($env:INPUT_MANUAL_QUALIFICATION -ceq 'pending' -and
              -not [string]::IsNullOrEmpty($env:INPUT_MANUAL_ACCEPTANCE_JSON)) {
            throw 'Pending qualification cannot accept or discard a manual result record.'
          }
          if ($env:INPUT_MANUAL_QUALIFICATION -ceq 'complete' -and
              [string]::IsNullOrWhiteSpace($env:INPUT_MANUAL_ACCEPTANCE_JSON)) {
            throw 'Complete qualification requires the verified manual result record.'
          }
          if ($env:INPUT_CANDIDATE_RUN_ID -cnotmatch '^[1-9][0-9]*$') {
            throw 'candidate_run_id must be a positive Actions run ID.'
          }

          $run = gh api "repos/$env:GH_REPO/actions/runs/$env:INPUT_CANDIDATE_RUN_ID" | ConvertFrom-Json
          if ([string]$run.name -cne 'Release Candidate' -or
              [string]$run.path -cne '.github/workflows/release-candidate.yml' -or
              [string]$run.event -cne 'workflow_dispatch' -or
              [string]$run.status -cne 'completed' -or
              [string]$run.conclusion -cne 'success' -or
              [string]$run.head_repository.full_name -cne $env:GH_REPO -or
              [string]$run.head_sha -cnotmatch '^[0-9a-f]{40}$') {
            throw 'The selected run is not a successful first-party Release Candidate run.'
          }
          "head_sha=$([string]$run.head_sha)" >> $env:GITHUB_OUTPUT

      - name: Check out the exact candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.candidate.outputs.head_sha }}
          persist-credentials: false

      - name: Install Rust 1.94.1 for locked signature verification
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1

      - name: Fetch the locked zero-dependency signature verifier
        shell: pwsh
        run: cargo fetch --manifest-path nuclear-app/src-tauri/Cargo.toml --locked

      - name: Download the candidate by run ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuclear-downloader-0.7.1-candidate
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Download exact-run acceptance evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuclear-downloader-0.7.1-acceptance
          path: acceptance
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Verify downloaded bytes and source identity
        id: qualification
        shell: pwsh
        env:
          EXPECTED_RELEASE_VERSION: ${{ inputs.release_version }}
          EXPECTED_COMMIT_SHA: ${{ steps.candidate.outputs.head_sha }}
          INPUT_MANUAL_ACCEPTANCE_JSON: ${{ inputs.manual_acceptance_json }}
          EXPECTED_MANUAL_SUBMITTER: ${{ github.actor }}
          INPUT_MANUAL_QUALIFICATION: ${{ inputs.manual_qualification }}
          NUCLEAR_UPDATE_KEY_ID: ${{ vars.NUCLEAR_UPDATE_KEY_ID }}
          NUCLEAR_UPDATE_PUBLIC_KEY: ${{ vars.NUCLEAR_UPDATE_PUBLIC_KEY }}
          NUCLEAR_UPDATE_NEXT_KEY_ID: ${{ vars.NUCLEAR_UPDATE_NEXT_KEY_ID }}
          NUCLEAR_UPDATE_NEXT_PUBLIC_KEY: ${{ vars.NUCLEAR_UPDATE_NEXT_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & scripts/verify-release-candidate.ps1 `
            -CandidateDirectory candidate `
            -ExpectedVersion $env:EXPECTED_RELEASE_VERSION `
            -ExpectedCommitSha $env:EXPECTED_COMMIT_SHA
          & scripts/verify-acceptance-evidence.ps1 `
            -EvidenceDirectory acceptance `
            -CandidateDirectory candidate `
            -ExpectedVersion $env:EXPECTED_RELEASE_VERSION `
            -ExpectedCommitSha $env:EXPECTED_COMMIT_SHA `
            -ExpectedCandidateRunId '${{ inputs.candidate_run_id }}'

          if (Test-Path -LiteralPath qualification) {
            throw 'The qualification staging directory already exists.'
          }
          New-Item -ItemType Directory -Path qualification | Out-Null
          $qualificationDirectory = Get-Item -LiteralPath qualification -Force
          if (-not $qualificationDirectory.PSIsContainer -or
              ($qualificationDirectory.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'The qualification staging directory is not an owned regular directory.'
          }
          if ($env:INPUT_MANUAL_QUALIFICATION -ceq 'complete') {
            $manualEvidenceBytes = [System.Text.Encoding]::UTF8.GetBytes($env:INPUT_MANUAL_ACCEPTANCE_JSON)
            if ($manualEvidenceBytes.Length -le 0 -or $manualEvidenceBytes.Length -gt 1MB) {
              throw 'The structured manual acceptance JSON is empty or oversized.'
            }
            $manualEvidencePath = Join-Path $qualificationDirectory.FullName 'windows-x64-manual-acceptance.json'
            [System.IO.File]::WriteAllText(
              $manualEvidencePath,
              $env:INPUT_MANUAL_ACCEPTANCE_JSON,
              [System.Text.UTF8Encoding]::new($false)
            )
            & scripts/verify-manual-acceptance-evidence.ps1 `
              -EvidencePath $manualEvidencePath `
              -CandidateDirectory candidate `
              -ExpectedVersion $env:EXPECTED_RELEASE_VERSION `
              -ExpectedCommitSha $env:EXPECTED_COMMIT_SHA `
              -ExpectedCandidateRunId '${{ inputs.candidate_run_id }}' `
              -ExpectedSubmitter $env:EXPECTED_MANUAL_SUBMITTER
            'status=complete' >> $env:GITHUB_OUTPUT
          } elseif ($env:INPUT_MANUAL_QUALIFICATION -ceq 'pending') {
            if (-not [string]::IsNullOrEmpty($env:INPUT_MANUAL_ACCEPTANCE_JSON)) {
              throw 'Pending qualification cannot accept or discard a manual result record.'
            }
            $inventoryPath = Join-Path (Resolve-Path candidate).Path 'release-candidate-inventory.json'
            $acceptance = Get-Content -Raw -LiteralPath acceptance/windows-x64-acceptance.json | ConvertFrom-Json
            $record = [ordered]@{
              schemaVersion = 1
              qualificationStatus = 'incomplete'
              releaseVersion = $env:EXPECTED_RELEASE_VERSION
              sourceCommit = $env:EXPECTED_COMMIT_SHA
              candidateRunId = '${{ inputs.candidate_run_id }}'
              candidateInventorySha256 = (Get-FileHash -LiteralPath $inventoryPath -Algorithm SHA256).Hash.ToLowerInvariant()
              authorizedBy = $env:EXPECTED_MANUAL_SUBMITTER
              recordedAt = [DateTimeOffset]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
              incompleteRequirements = @($acceptance.incompleteRequirements)
            }
            [System.IO.File]::WriteAllText(
              (Join-Path $qualificationDirectory.FullName 'pending-manual-qualification.json'),
              ($record | ConvertTo-Json -Depth 8),
              [System.Text.UTF8Encoding]::new($false)
            )
            'status=incomplete' >> $env:GITHUB_OUTPUT
          } else {
            throw 'Manual qualification mode was not validated.'
          }

      - name: Retain private qualification record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuclear-downloader-0.7.1-qualification
          path: qualification/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: false

      - name: Create or recover and independently verify a draft release
        id: draft
        shell: pwsh
        env:
          EXPECTED_COMMIT_SHA: ${{ steps.candidate.outputs.head_sha }}
          MANUAL_QUALIFICATION: ${{ steps.qualification.outputs.status }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = 'v0.7.1'
          function Get-CandidateDraft {
            # The tag endpoint only finds published releases, not untagged drafts.
            $pages = gh api "repos/$env:GH_REPO/releases?per_page=100" --paginate --slurp | ConvertFrom-Json -DateKind String
            $candidates = @($pages | ForEach-Object { $_ } | Where-Object { [string]$_.tag_name -ceq $tag })
            if ($candidates.Count -gt 1) {
              throw "Release $tag is ambiguous. No draft will be changed."
            }
            if ($candidates.Count -eq 1) {
              if ($candidates[0].draft -ne $true) {
                throw "Release $tag already exists. Published releases are immutable."
              }
              return $candidates[0]
            }
          }

          $existingDraft = Get-CandidateDraft
          $tagRefs = @(gh api "repos/$env:GH_REPO/git/matching-refs/tags/$tag" | ConvertFrom-Json | Where-Object { [string]$_.ref -ceq "refs/tags/$tag" })
          if ($tagRefs.Count -gt 1) {
            throw "Tag $tag is ambiguous. No release will be changed."
          }
          if ($tagRefs.Count -eq 1 -and
              ([string]$tagRefs[0].object.type -cne 'commit' -or
               [string]$tagRefs[0].object.sha -cne $env:EXPECTED_COMMIT_SHA)) {
            throw "Tag $tag must point directly to the exact verified candidate commit."
          }

          $inventory = Get-Content -Raw -LiteralPath candidate/release-candidate-inventory.json | ConvertFrom-Json
          $assetPaths = @(
            $inventory.assets |
              ForEach-Object { Join-Path (Resolve-Path candidate).Path ([string]$_.fileName) }
          )
          if ($assetPaths.Count -ne 10) {
            throw 'The public release must contain exactly ten inventoried assets.'
          }

          $releaseNotes = @(
            'Nuclear Downloader 0.7.1 completes a substantial internal refactor while preserving the existing interface and workflows.'
            ''
            '### Highlights'
            ''
            '- Clear ownership for page lifecycle, queue presentation, and inspection, download, update, and settings workflows.'
            '- Focused backend modules for state commands, process supervision, output handling, and safe file publication.'
            '- Fixed stale asynchronous results, filename-edit races, and cancellation during playlist admission.'
            '- Removed a redundant link-inspection request and fixed multi-video X posts resolving to another playlist.'
            '- Updated yt-dlp to 2026.08.19, resolving the reproduced YouTube HTTP 403 for Best-quality MP4.'
            '- Fixed empty optional signing-key settings incorrectly blocking authenticated app and runtime updates.'
            '- Expanded regression, lifecycle, architecture, and performance checks without changing the existing user experience.'
            ''
            'This is a normal 0.7.1 release. Work toward 1.0 continues.'
            ''
            'This 0.7.1 build replaces the initial 0.7.1 publication to correct updater key handling. Original 0.6 and earlier 0.7.1 installations need a one-time manual installation of this corrected setup; an unchanged version number cannot trigger an update from the earlier 0.7.1 build.'
            ''
            'Windows x64 is the supported platform for this release. SHA256SUMS contains the complete public artifact inventory.'
          ) -join "`n"
          $qualificationNote = switch -CaseSensitive ($env:MANUAL_QUALIFICATION) {
            'complete' { 'Automated acceptance and the recorded manual qualification checks passed for these exact artifacts.' }
            'incomplete' { 'Automated Windows acceptance passed for these exact artifacts. Manual qualification remains pending: clean Windows 11 installer and portable checks, maintainer-controlled YouTube/X fixtures, dedicated-account cookie login, signed app update, and signed runtime update/rollback. The built-in app-update test follows publication so older installations can discover this release.' }
            default { throw 'No verified qualification status was supplied for the release notes.' }
          }
          $releaseNotes += "`n`n### Validation`n`n$qualificationNote"
          $releaseNotesPath = Join-Path (Get-Location).Path 'release-notes.md'
          [System.IO.File]::WriteAllText($releaseNotesPath, $releaseNotes, [System.Text.UTF8Encoding]::new($false))

          if ($null -eq $existingDraft) {
            & gh release create $tag @assetPaths `
              --repo $env:GH_REPO `
              --target $env:EXPECTED_COMMIT_SHA `
              --title 'Nuclear Downloader 0.7.1' `
              --notes-file $releaseNotesPath `
              --draft
            if ($LASTEXITCODE -ne 0) {
              throw 'GitHub failed to create the draft release.'
            }
          }

          $draft = Get-CandidateDraft
          if ($null -eq $draft -or [string]$draft.id -cnotmatch '^[1-9][0-9]*$') {
            throw 'The draft release has no unambiguous numeric release ID.'
          }
          $release = gh api "repos/$env:GH_REPO/releases/$($draft.id)" | ConvertFrom-Json
          if ($release.draft -ne $true -or $release.prerelease -ne $false -or
              [string]$release.id -cne [string]$draft.id -or
              [string]$release.tag_name -cne $tag -or
              [string]$release.name -cne 'Nuclear Downloader 0.7.1' -or
              [string]$release.target_commitish -cne $env:EXPECTED_COMMIT_SHA -or
              [string]$release.body -cne $releaseNotes -or
              @($release.assets).Count -ne $assetPaths.Count) {
            throw 'The draft release identity or asset count is not exact.'
          }
          foreach ($expected in $inventory.assets) {
            $matches = @($release.assets | Where-Object { [string]$_.name -ceq [string]$expected.fileName })
            if ($matches.Count -ne 1 -or [long]$matches[0].size -ne [long]$expected.size -or
                [string]$matches[0].state -cne 'uploaded') {
              throw "The draft release does not exactly match $([string]$expected.fileName)."
            }
            if ([string]$matches[0].digest -cne "sha256:$([string]$expected.sha256)") {
              throw "GitHub reported a missing or mismatched digest for $([string]$expected.fileName)."
            }
          }
          "release_id=$($release.id)" >> $env:GITHUB_OUTPUT

      - name: Publish the exact verified draft
        shell: pwsh
        env:
          VERIFIED_RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:VERIFIED_RELEASE_ID -cnotmatch '^[1-9][0-9]*$') {
            throw 'No verified release ID was supplied.'
          }
          gh api --method PATCH "repos/$env:GH_REPO/releases/$env:VERIFIED_RELEASE_ID" `
            -F draft=false -f make_latest=true --silent
